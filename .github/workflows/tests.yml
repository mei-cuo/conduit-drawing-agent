name: Agent checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev,api]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m pytest -q
      - run: python -m drawflow demo --run-id ci-demo --simulate-error
      - run: python -m drawflow evaluate --report outputs/evaluation.json
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            outputs/ci-demo/*.json
            outputs/evaluation.json
            dist/*
