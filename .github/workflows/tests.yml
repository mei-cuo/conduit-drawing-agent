name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      LANGSMITH_TRACING: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m conduit --mock --simulate-error --out outputs/ci-demo
      - run: python -m conduit --input data/examples/reference_drawing.png --ocr sidecar --ocr-json data/examples/reference_ocr_paddle.json --vision-backend agent-file --agent-response data/examples/reference_agent_response.json --out outputs/ci-reference
