[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "conduit-drawing-workflows"
version = "0.1.0"
readme = "README.md"
description = "Evidence-grounded conduit drawing recognition with LangChain models and LangGraph orchestration"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4,<2", "langchain-core>=1.6,<2", "langchain-openai>=1.7,<2",
  "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4",
  "langsmith>=0.14.8,<1",
  "pydantic>=2.7,<3", "Pillow>=11,<13", "PyMuPDF>=1.26,<2", "python-dotenv>=1,<2"
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<0.4"]
dev = ["pytest>=8,<10"]

[project.scripts]
conduit = "conduit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
conduit = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
cache_dir = ".pytest_cache"
