[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "drawflow-agent"
version = "0.1.0"
description = "Evidence-grounded drawing agent with LangGraph, hybrid RAG and project memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4,<2", "langchain-openai>=1.7,<2", "langchain-text-splitters>=1,<2",
  "langgraph>=1.2,<2", "langgraph-checkpoint-sqlite>=3.1,<4", "langsmith>=0.14.8,<1",
  "qdrant-client>=1.12,<2", "pydantic>=2.7,<3", "python-dotenv>=1,<2",
  "Pillow>=11,<13", "PyMuPDF>=1.26,<2", "httpx>=0.28,<1", "PyYAML>=6,<7"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "ruff>=0.17,<1"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.scripts]
drawflow = "drawflow.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
drawflow = ["assets/prompts/*.md", "assets/skills/*/SKILL.md", "assets/knowledge/*.md", "assets/demo/*.json", "assets/demo/*.png"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
